version: '3.8'

services:
  saku-postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: saku-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: saku_admin
      POSTGRES_PASSWORD: saku_secret_password
      POSTGRES_DB: saku_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saku_admin -d saku_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  saku-redis:
    image: redis:7-alpine
    container_name: saku-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
