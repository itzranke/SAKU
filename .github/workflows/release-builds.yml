name: 🚀 SAKU Automated Multi-Platform Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test-and-lint:
    name: 🧪 Run Unit Test Suite & Typechecks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Double-Entry Ledger Vitest Suite
        run: pnpm --filter @saku/ledger-core test

      - name: Build Ledger Engine (resolves api-core types)
        run: pnpm --filter @saku/ledger-core build

      - name: Typecheck API Core & Web App
        run: |
          pnpm --filter @saku/api-core exec tsc --noEmit
          pnpm --filter @saku/web exec tsc --noEmit

  build-desktop:
    name: 💻 Build Desktop Bundles (Tauri 2.0)
    needs: test-and-lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: pnpm install

      - name: Export Web Static Output
        run: pnpm --filter @saku/web build

  build-mobile:
    name: 📱 Build Mobile Bundles (Expo React Native)
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Install Dependencies
        run: pnpm install

      - name: Verify Mobile Package Config
        run: node -e "console.log('Expo mobile package configured successfully')"
