name: SAKU CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Codebase
        run: pnpm lint

      - name: Typecheck (ledger engine is a build-order dependency)
        run: |
          pnpm --filter @saku/ledger-core build
          pnpm --filter @saku/api-core exec tsc --noEmit
          pnpm --filter @saku/web exec tsc --noEmit

      - name: Build Core Packages & Web (Tauri/EAS bundles live in release-builds.yml)
        run: pnpm turbo run build --filter=@saku/ledger-core --filter=@saku/api-core --filter=@saku/web
